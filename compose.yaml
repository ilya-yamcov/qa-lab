name: qa-lab

services:

  postgres:
    image: postgres:17-alpine
    container_name: qa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - qa-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  adminer:
    image: adminer:latest
    container_name: qa-adminer
    restart: unless-stopped

    ports:
      - "8082:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - qa-net


  kafka-permissions:
    image: alpine:3.22
    container_name: qa-kafka-permissions

    user: "0:0"

    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /data
        chmod -R u+rwX /data

    volumes:
      - kafka_data:/data

    networks:
      - qa-net

    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    container_name: qa-kafka
    hostname: kafka
    restart: unless-stopped

    depends_on:
      kafka-permissions:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    ports:
      - "29092:29092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://:19092,
        CONTROLLER://:9093,
        PLAINTEXT_HOST://:29092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:19092,
        PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST}:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    networks:
      - qa-net

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: qa-kafka-init

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic orders \
          --partitions 3 \
          --replication-factor 1

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - qa-net

    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: qa-kafka-ui
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: qa-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

    depends_on:
      - kafka

    networks:
      - qa-net


  demo-api:
    build:
      context: ./demo-api

    container_name: qa-demo-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: orders

      LOG_FILE: /app/logs/app.log

    volumes:
      - app_logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - qa-net


  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: qa-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - qa-net


  grafana:
    image: grafana/grafana:13.2.0
    container_name: qa-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    networks:
      - qa-net


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: qa-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.autoconfiguration.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    mem_limit: 2g

    networks:
      - qa-net


  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1
    container_name: qa-kibana
    restart: unless-stopped

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'

    depends_on:
      - elasticsearch

    mem_limit: 1g

    networks:
      - qa-net


  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    container_name: qa-fluent-bit
    restart: unless-stopped

    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - app_logs:/logs:ro
      - fluent_bit_state:/state

    depends_on:
      - elasticsearch
      - demo-api

    networks:
      - qa-net


networks:

  qa-net:
    driver: bridge


volumes:

  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  app_logs:
  fluent_bit_state:
